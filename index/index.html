<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradingView Self-host - Multi Exchange</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar input, .topbar select {
      width: 180px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }
    .topbar input {
      direction: ltr;
    }
    .pill {
      padding: 8px 12px;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 14px;
    }
    #status {
      margin-right: auto;
      color: #6b7280;
      font-size: 13px;
    }
    #tv_chart_container {
      height: calc(100vh - 72px);
      min-height: 640px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>TradingView Multi-Exchange</strong>

    <span>صرافی:</span>
    <select id="exchangeSelect">
      <option value="nobitex">درحال بارگذاری...</option>
    </select>

    <input id="symbolSearch" placeholder="BTCIRT" value="BTCIRT" />
    <span>نماد:</span>
    <span id="symbolLabel" class="pill">BTCIRT</span>
    <span id="status"></span>
  </div>

  <div id="tv_chart_container"></div>

  <script>
    window.NOBITEX_TV_API_BASE = 'https://apiwidgets.rebategain.com/tv';
    window.NOBITEX_TV_DEFAULT_SYMBOL = 'BTCIRT';
    window.NOBITEX_TV_DEFAULT_RESOLUTION = '15';
    window.NOBITEX_TV_LIBRARY_PATH = './static/charting_library/';
  </script>

  <script src="./static/charting_library/charting_library.standalone.js"></script>
  <script src="./static/app.js"></script>
</body>
</html>
